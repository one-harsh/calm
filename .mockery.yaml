with-expecter: true
inpackage: true
dir: "{{.InterfaceDir}}"
filename: "mock_{{.InterfaceNameSnake}}.go"
mockname: "Mock{{.InterfaceName}}"
boilerplate-file: ".mockery-header.txt"

# Port interfaces listed explicitly. New ports added to a package require
# adding the interface here — small maintenance cost, and the explicit list
# keeps internal-helper interfaces (like the unexported `queryer` in db)
# from being mocked just because they exist.
packages:
  github.com/one-harsh/calm/internal/db:
    interfaces:
      ClientRepo:
      SessionRepo:
      EventsRepo:
      SourcesRepo:
      ChunksRepo:
      DAL:
  github.com/one-harsh/calm/internal/secrets:
    interfaces:
      SecretReader:
  github.com/one-harsh/calm/internal/session:
    interfaces:
      expirySource:
  github.com/one-harsh/calm/internal/server/middleware:
    interfaces:
      SessionResolver:
