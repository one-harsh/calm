# Parallel fan-out of the gates in `task ci` (the serial local equivalent),
# plus the cross-platform compile matrix (`task build:all` locally).
# Each job is an independent runner; only `test` needs Postgres.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # PR: HEAD is the synthetic merge ref, so the deepest PR commit sits
          # at depth (commits + 1) and the base SHA is the merge's first parent
          # at depth 2 — fetch-depth: commits plus the --deepen=1 below covers
          # both for the `base.sha..HEAD` DCO range. No waste, scales with PR size.
          # Push: 50-commit bound (event payload doesn't expose a delta count
          # reliably; pushes >20 truncate, first-push-to-branch and
          # force-push edge cases need a fallback either way).
          fetch-depth: ${{ github.event_name == 'pull_request' && github.event.pull_request.commits || 50 }}

      - name: Make DCO boundary commit available
        if: github.event_name == 'pull_request'
        run: git fetch --deepen=1

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: DCO sign-off check
        env:
          DCO_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # Push-to-main only: exempt GitHub-assembled squash commits (verified
          # per-commit on the PR run). Never set on PR runs — see dco:check.
          DCO_EXEMPT_WEBFLOW: ${{ github.event_name == 'push' && '1' || '' }}
        run: task dco:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lint tools
        run: task tools:install:lint

      - name: Lint
        run: task lint

  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install codegen tools
        run: task tools:install:gen

      - name: Codegen drift check
        run: task gen:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Postgres (custom pg_textsearch image)
        run: task dev:up

      - name: Unit + integration tests
        run: task test

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: examples/eval-harness/requirements.txt

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install eval-harness dependencies
        run: task example:eval:deps

      - name: Eval-harness checks
        run: task example:eval:check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Coverage gate
        run: task test:cover

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.filtered.out
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: task build

  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross compile-check (packages + all test files)
        run: task build:target GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
