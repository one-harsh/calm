name: CI

on:
  push:
    branches-ignore:
      - 'gh-pages'
    tags-ignore:
      - '**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # PR: fetch exactly (commits + 1) so `HEAD~N..HEAD` resolves for the
          # DCO range — no waste, scales naturally with PR size.
          # Push: 50-commit bound (event payload doesn't expose a delta count
          # reliably; pushes >20 truncate, first-push-to-branch and
          # force-push edge cases need a fallback either way).
          fetch-depth: ${{ github.event_name == 'pull_request' && github.event.pull_request.commits || 50 }}

      - name: Make DCO boundary commit available
        if: github.event_name == 'pull_request'
        run: git fetch --deepen=1

      - uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: DCO sign-off check
        # Hoisted out of `task ci` so it fails early.
        env:
          DCO_BASE: ${{ github.event_name == 'pull_request' && format('HEAD~{0}', github.event.pull_request.commits) || github.event.before }}
        run: task dco:check

      - name: Install Go tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/vektra/mockery/v2@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          go install github.com/google/addlicense@latest

      - name: Start Postgres (custom pg_textsearch image)
        run: task dev:up

      - name: Run CI gate
        run: task ci

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.filtered.out
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Postgres
        if: always()
        run: task dev:down
