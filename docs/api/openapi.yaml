openapi: 3.0.3
info:
  title: CALM API
  version: 1.0.0
  description: |
    HTTP API for CALM — a context-management service that filters and
    compresses tool output before it enters the LLM context window. Workloads
    create a session, ingest tool output into it, search across it, capture
    structured events, and tear it down at the end of work.

    Authentication: every request carries `X-CALM-API-Key: <namespace-api-key>`.
    CALM resolves the key to a namespace and enforces it on every operation.
    Cross-namespace access returns 404 (invisibility, not denial — the
    response is indistinguishable from a truly nonexistent resource).

    Namespaces configured with `require_client_credentials: true` additionally
    require `Authorization: Bearer <client-token>` carrying the per-client
    token issued by `POST /v1/clients/{name}`. Namespaces without the flag
    set ignore the Authorization header.

    Session-touching operations (ingest, search, events, snapshot, sources,
    delete) carry the session credential in `X-CALM-Session-Token`. The
    server mints this token at `POST /v1/sessions` and returns it once in
    the response; workloads persist it and present it on every subsequent
    call. Lost tokens are unrecoverable — operationally equivalent to
    losing the session.

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - apiKey: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Service health
      description: |
        Operational health endpoint. Returns 200 when the process is up and its
        dependencies (Postgres connection, required extensions) are reachable;
        503 when degraded. Unauthenticated — k8s probes do not carry bearer
        tokens. Suitable for both liveness and readiness probes at v1; a
        liveness/readiness split can be introduced later without breaking this
        endpoint.
      tags: [operational]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResult' }
        '503':
          description: Service is degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResult' }

  /v1/version:
    get:
      operationId: getVersion
      summary: Service version
      description: |
        Returns the running binary's version metadata. Unauthenticated.
        Useful for deployment verification and incident triage.
      tags: [operational]
      security: []
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResult' }

  /v1/clients/{name}:
    parameters:
      - $ref: '#/components/parameters/ClientName'
    post:
      operationId: registerClient
      summary: Register a client in the namespace
      description: |
        Establishes the client as a first-class entity. Returns 201 with
        the registered name; 409 if the name is already taken (workloads that
        intend restart-safety treat 409 as success).

        In namespaces with `require_client_credentials: true`, the response
        body additionally carries a one-time `client_token` — a per-client
        secret the workload must persist and present via `Authorization: Bearer`
        on subsequent operations. Lost tokens require rotation; CALM has no
        path to recover them.

        This endpoint itself is exempt from the client-token requirement (the
        client doesn't have a token yet), but still requires the namespace API
        key.
      tags: [clients]
      security:
        - apiKey: []
      responses:
        '201':
          description: Client registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterClientResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/clients/{name}/rotate-token:
    parameters:
      - $ref: '#/components/parameters/ClientName'
    post:
      operationId: rotateClientToken
      summary: Rotate the client's bearer token (credentialed namespaces only)
      description: |
        Mints a new client token and invalidates the previous one
        atomically. Only valid in namespaces with `require_client_credentials: true`;
        other namespaces return 404 (invisibility-not-denial).
        Sessions owned by this client persist across rotation — only the
        credential changes. Requires the current client token in the
        Authorization header.
      tags: [clients]
      security:
        - apiKey: []
          clientToken: []
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateClientTokenResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a session
      description: |
        CALM mints the session token and returns it in the response —
        workloads do not supply identifiers. Namespace is resolved from
        the API key, never from the body. When the namespace does not
        require client credentials, `client` is workload-supplied and must
        reference a previously-registered client (auto-default to `default`
        when omitted). When it does, `client` is ignored — or, if present,
        must match the auth-resolved client; the session is bound to the
        client whose token was presented.

        Idempotency: `Idempotency-Key` lets a workload safely retry a create
        across transient failures and receive the same `session_token`. The
        dedup window is server-configured (~1h default); retries beyond it
        create a new session.
      tags: [sessions]
      security:
        - apiKey: []
          clientToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteSession
      summary: Tear down a session and all its data
      description: Tear down a session.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
      responses:
        '204':
          description: Session deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sources:
    get:
      operationId: listSources
      summary: List ingested sources within a session
      description: End-of-work observability — what was indexed and how much.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSourcesResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/snapshot:
    get:
      operationId: getSnapshot
      summary: Return session events ordered by priority and recency within a byte budget
      description: |
        Generic event store — CALM does not interpret event
        content or build a structured state representation. Workloads needing
        structured shapes build them in their own middleware from the returned
        event stream.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
        - in: query
          name: budget_bytes
          schema: { type: integer, minimum: 256, maximum: 8192, default: 2048 }
          description: |
            Event-payload budget for the snapshot: bounds the summed JSON size
            of the returned events. It does not count the response envelope or
            the array separators between events, so the actual HTTP body is
            slightly larger. Server caps at 8KB.
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ingest:
    post:
      operationId: ingest
      summary: Ingest raw content; return a compact representation
      description: |
        Chunks, indexes, optionally orders the compact summary by
        intent relevance via RRF. Same `source` label within a session
        replaces previous content idempotently (invariant #6).
      tags: [ingest]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '200':
          description: Compact representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/search:
    post:
      operationId: search
      summary: Query indexed content within a session
      description: |
        Two-layer fallback (primary tokenizer → trigram) is internal. Layer 1
        runs against both `chunks_fts_prose` and `chunks_fts_code` and the two
        rankings are RRF-fused; results from both tokenization paths come back
        in one ranked list. Workload does not scope by content_type.

        Assembly is byte-budgeted across all submitted queries: `budget_bytes`
        (default 4096, clamped to the server ceiling) bounds the summed
        compact-JSON size of the returned hits. The budget is strict — a hit is
        included only when it fits, with no overshoot and no snippet truncation.
        A per-namespace allocator distributes the budget across queries;
        `X-CALM-Allocator-Variant` overrides it per request where the namespace
        allows. The response reports `byte_budget_used`, `budget_exceeded`, the
        committed `budget_bytes`, and per-query `budget_omitted`.
      tags: [search]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
        - $ref: '#/components/parameters/AllocatorVariantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Ranked results, grouped by query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/feedback:
    post:
      operationId: feedback
      summary: Report outcome for a value-producing call
      description: |
        Closes the outcome-attribution loop. Workloads post the
        X-CALM-Correlation-Id they received from a prior /v1/ingest,
        /v1/search, or /v1/snapshot response, plus an outcome enum. CALM
        emits outcome-attributed metrics at receipt. Requires both the
        namespace API key and the session token from the call being
        attributed — feedback for a torn-down session is not possible;
        workloads with delayed outcome signals must either keep the
        session alive until feedback fires or accept no outcome
        attribution for those calls.
      tags: [feedback]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
        - $ref: '#/components/parameters/WorkloadRequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '204':
          description: Feedback recorded
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/events:
    post:
      operationId: writeEvents
      summary: Record session events
      description: |
        `type` is workload-defined (no fixed taxonomy). `priority`
        is required (1=critical, 4=noise). `data` is opaque to CALM. Generic
        event store — CALM persists and serves; workloads interpret.
      tags: [events]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteEventsRequest' }
      responses:
        '202':
          description: Events accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteEventsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: readEvents
      summary: Read events for a session
      description: Supports filtering by `types` and `min_priority`.
      tags: [events]
      parameters:
        - $ref: '#/components/parameters/SessionTokenHeader'
        - in: query
          name: types
          schema:
            type: array
            items: { type: string }
          style: form
          explode: false
          description: Comma-separated list of event types to filter by.
        - in: query
          name: min_priority
          schema: { type: integer, minimum: 1, maximum: 4 }
          description: Return only events with priority ≤ this value (lower = more important).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadEventsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/manage/sessions:
    parameters:
      - in: query
        name: client
        schema: { type: string }
        description: Filter by client identifier within the API key's namespace.
      - in: query
        name: labels
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: { type: string }
        description: |
          Label filter. Serialized as `labels[key]=value` (deepObject style).
          Multiple pairs are AND-ed.
    get:
      operationId: manageListSessions
      summary: List sessions in the API key's namespace
      description: Scoped to the API key's namespace. Returns rich session info including labels, last activity, and event count.
      tags: [manage]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListManagedSessionsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: manageDeleteSessions
      summary: Bulk-delete sessions in the namespace
      description: "`dry_run=true` returns the affected count without deleting."
      tags: [manage]
      parameters:
        - in: query
          name: dry_run
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Result of delete (or dry-run count)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteManagedSessionsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/manage/clients:
    get:
      operationId: manageListClients
      summary: List clients in the API key's namespace
      description: |
        Read-only at v1 — operators can see which clients exist and
        their activity. Useful for spotting typo-clients and dead workloads.
      tags: [manage]
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListClientsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/manage/clients/{client}:
    parameters:
      - in: path
        name: client
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    delete:
      operationId: manageDeleteClient
      summary: Remove a client and cascade all its sessions
      description: |
        Cascades through `sessions.client` FK — all the client's
        sessions, sources, chunks, events, and labels are removed. The `default`
        client cannot be deleted (returns 409) — it's the bootstrap fallback
        for sessions without a `client` field.
      tags: [manage]
      parameters:
        - in: query
          name: dry_run
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Result of delete (or dry-run count)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteClientResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-CALM-API-Key
      description: |
        Namespace API key. Operator-issued, long-lived, configured per-namespace
        in the CALM YAML. Required on every request that isn't operational
        (health/version) or registration (POST /v1/clients/{name}).
    clientToken:
      type: http
      scheme: bearer
      description: |
        Per-client bearer token, issued at registration when the namespace has
        require_client_credentials=true. Required for session-touching
        operations in those namespaces; ignored when the flag is false. Issued once at
        POST /v1/clients/{name} time and on rotation; not recoverable post-mint.

  parameters:
    SessionTokenHeader:
      in: header
      name: X-CALM-Session-Token
      required: true
      schema: { type: string, minLength: 1 }
      description: |
        Session credential. Treat as secret. Obtained once from the
        createSession response and presented on every session-touching call.
        Lost tokens are unrecoverable.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: |
        Opaque per-request key. When present, the server returns the same
        `session_token` for retries with the same key within the dedup
        window (~1h default). Use a fresh key per intended distinct session;
        reusing a key collapses retries into one session.
    ClientName:
      in: path
      name: name
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-zA-Z0-9_-]+$' }
    WorkloadRequestIdHeader:
      in: header
      name: X-Workload-Request-Id
      required: false
      schema: { type: string, maxLength: 256 }
      description: |
        Workload-supplied correlation token, echoed verbatim on the response
        when present. Distinct from the server-minted X-CALM-Correlation-Id;
        intended for the workload's own log/trace correlation. CALM does not
        interpret the value.
    AllocatorVariantHeader:
      in: header
      name: X-CALM-Allocator-Variant
      required: false
      schema: { type: string }
      description: |
        Per-request override of the namespace's default budget allocator.
        Honored only when the namespace enables allocator override; otherwise
        silently ignored (never rejected). Recognized values: `rank-round`,
        `score-proportional`, `knapsack-greedy`, `equal-budget`, `mmr`.
        Unrecognized values are ignored, falling back to the namespace default.

  headers:
    XCALMCorrelationId:
      description: Server-minted UUIDv7 correlation ID for this response. Present on every response (incl. 4xx/5xx).
      schema: { type: string, format: uuid }
      required: true
    XWorkloadRequestId:
      description: Echoed when the request carried a non-oversized `X-Workload-Request-Id`. Absent otherwise.
      schema: { type: string, maxLength: 256 }
    Traceresponse:
      description: W3C trace-context. Emitted when the request carried a valid inbound `traceparent`. Absent otherwise.
      schema: { type: string }

  responses:
    BadRequest:
      description: |
        Malformed request. Every response (this one included) carries the
        observability headers declared under `components.headers` — the
        binding is via Context middleware, not via per-response codegen, so
        the spec describes them here in prose rather than per-operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Resource not found within the caller's namespace. Cross-namespace
        access returns 404, not 403 — invisibility, not denial.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with current state (e.g., duplicate session, attempt to delete `default` client)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: |
        The feedback acceptance window for this correlation has expired.
        The correlation_id's embedded UUIDv7 timestamp is older than the
        namespace's configured feedback_ttl_minutes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeded the configured size limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Per-namespace rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        endpoint: { type: string }
        detail: { type: string }

    RegisterClientResult:
      description: |
        Response to a successful client registration. `client_token` is only
        present in namespaces with `require_client_credentials: true` — it
        is shown once and not recoverable. Omitted entirely when the flag
        is false.
      type: object
      required: [name, namespace, created_at]
      properties:
        name: { type: string }
        namespace: { type: string }
        created_at: { type: string, format: date-time }
        client_token: { type: string, description: One-time bearer token; present only when require_client_credentials is true for the namespace. }

    RotateClientTokenResult:
      type: object
      required: [name, namespace, client_token, rotated_at]
      properties:
        name: { type: string }
        namespace: { type: string }
        client_token: { type: string, description: The new bearer token; replaces the previous one immediately. }
        rotated_at: { type: string, format: date-time }

    Session:
      description: |
        Created session, returned once. `session_token` is the secret
        credential the workload must persist and present via
        `X-CALM-Session-Token` on every subsequent call. Other fields
        confirm what CALM committed after namespace resolution, client
        binding, and operator-ceiling clamping on `ttl_minutes`.
      type: object
      required: [session_token, namespace, client, ttl_minutes, created_at]
      properties:
        session_token: { type: string, description: One-time secret credential. Lost tokens are unrecoverable. }
        namespace: { type: string }
        client: { type: string }
        ttl_minutes: { type: integer }
        created_at: { type: string, format: date-time }

    ManagedSession:
      description: |
        Session shape returned by the management API. Session credentials
        are not surfaced — operators correlate by client and labels.
      type: object
      required: [namespace, client, ttl_minutes, created_at, last_activity, event_count]
      properties:
        namespace: { type: string }
        client: { type: string }
        ttl_minutes: { type: integer }
        created_at: { type: string, format: date-time }
        last_activity: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        event_count: { type: integer }

    CreateSessionRequest:
      type: object
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 256
          description: Workload identifier. Must reference a previously-registered client. Omitted attributes to `default`.
        labels:
          type: object
          additionalProperties: { type: string }
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: Inactivity timeout. Clamped to the operator-configured ceiling.

    CascadeCounts:
      description: Counts of dependent rows removed by a cascading delete.
      type: object
      required: [sources, chunks, events, labels]
      properties:
        sources: { type: integer }
        chunks: { type: integer }
        events: { type: integer }
        labels: { type: integer }

    SectionPreview:
      type: object
      required: [title]
      properties:
        title: { type: string }
        preview: { type: string }
        matches:
          type: array
          items: { type: string }
          description: |
            When `intents` were provided on ingest, the subset of intents this
            section matches (by appearance in any intent's top-K). Empty array
            means matched no intent. Absent when ingest had no intents.

    IngestRequest:
      type: object
      required: [content, source]
      properties:
        content: { type: string }
        source:
          type: string
          minLength: 1
          description: Label identifying this content within the session. Re-ingesting with the same source replaces prior content (invariant #6).
        format:
          type: string
          enum: [log, stacktrace, csv, tsv, metrics, json, markdown, text]
          description: Format hint for chunking. If absent, CALM auto-detects.
        content_type:
          type: string
          description: |
            Workload-provided default for tokenization branching. `code`
            for source-file or build-output content; `prose` for natural-language
            content (default if omitted). The chunker may override per chunk when
            format signals demand it — fenced code blocks inside a markdown ingest
            are classified as `code` regardless of the top-level hint, and stacktrace
            frames are always `code`. Unknown values persist as-is but are treated
            as `prose` for tokenization until their strategies are implemented.
        intents:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1 }
          description: |
            Up to 3 intent strings. When provided and content exceeds
            the configured size threshold, `summary` is ordered by RRF across
            per-intent rankings and each section carries a `matches` array.

    IngestResult:
      type: object
      required: [sections_indexed, sections_total, summary_truncated, source, summary, distinctive_terms]
      properties:
        sections_indexed: { type: integer, description: Number of sections actually indexed, capped at 500 per source. }
        sections_total: { type: integer, description: Total sections produced by chunking; exceeds `sections_indexed` when the 500-section indexing cap fired. }
        summary_truncated: { type: boolean, description: True when the returned `summary` covers fewer sections than `sections_total` (the summary is capped at 50 entries). }
        source: { type: string, description: Echoes the request `source` for confirmation. }
        summary:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SectionPreview' }
          description: One entry per indexed section, capped at 50.
        distinctive_terms:
          type: array
          maxItems: 40
          items: { type: string }
          description: Top terms by IDF in this session, capped at 40. Vocabulary the LLM should use for follow-up search.

    SearchRequest:
      type: object
      properties:
        queries:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1 }
          x-go-type-skip-optional-pointer: true
          description: |
            Queries to rank content against. When omitted or empty and `source`
            is supplied, the search returns that source's chunks in document
            order instead of by relevance (see `offset`).
        source:
          type: string
          description: |
            Scopes the search to a specific source label. Also selects
            document-order mode: with no `queries`, the source's chunks are
            returned in the order they were indexed.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        offset:
          type: integer
          minimum: 0
          default: 0
          description: |
            Document-order pagination cursor: the zero-based chunk index to
            start from. Silently ignored when `queries` are present. It has no
            upper bound — an offset past the end returns an empty final page,
            not an error.
        budget_bytes:
          type: integer
          minimum: 1
          default: 4096
          description: |
            Whole-response byte budget across all submitted queries: bounds the
            summed compact-JSON size of the returned hits. It does not count the
            response envelope or the array separators, so the actual HTTP body is
            slightly larger. The server clamps values above its ceiling rather
            than rejecting them; `budget_bytes` in the response echoes the
            committed (post-clamp) value.

    SearchHit:
      type: object
      required: [title, snippet, source, match_layer]
      properties:
        title: { type: string }
        snippet:
          type: string
          description: Exact-text excerpt from the indexed chunk around the matching terms (invariant #5 — never paraphrased).
        source: { type: string }
        match_layer:
          type: string
          enum: [primary, trigram, document]
          description: |
            Which fallback layer produced this hit. `primary` covers both the
            prose and code FTS indexes (RRF-fused at layer 1) — workloads do
            not see, and do not need to disambiguate, which tokenizer matched.
            `document` is a mode indicator, not a relevance layer: it marks a
            hit returned by document-order pagination rather than ranked
            retrieval.
        truncated:
          type: boolean
          description: |
            Present and true only for the first chunk of a document-order page
            whose full text alone exceeds `budget_bytes`: the `snippet` is an
            exact-text prefix of that chunk, and the chunk still counts as
            consumed (`next_offset` advances past it).

    SearchResult:
      type: object
      required: [results, byte_budget_used, budget_exceeded, budget_bytes]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/QuerySearchResult' }
          description: Ranked hits per query, in the order the queries were submitted.
        byte_budget_used:
          type: integer
          description: |
            Compact-JSON bytes consumed by the returned hits, summed across all
            queries. Never exceeds `budget_bytes` — the budget is strict, with no
            overshoot.
        budget_exceeded:
          type: boolean
          description: |
            True when at least one otherwise-returnable hit was omitted because
            the budget could not accommodate it. When no hit fits at all, the
            results are empty and this is true — the retry signal is to raise
            `budget_bytes`.
        budget_bytes:
          type: integer
          description: |
            The committed budget after the server clamps to its ceiling. Compare
            against the requested value to detect clamping.
        next_offset:
          type: integer
          description: |
            Document-order pagination cursor for the next page: present when
            more chunks remain past the returned page, its value the `offset`
            to request next; omitted on the final page. Never present on ranked
            (query) responses.

    QuerySearchResult:
      type: object
      required: [query, hits, budget_omitted]
      properties:
        query:
          type: string
          description: |
            Echoes the submitted query. In document-order mode (no queries),
            this is the empty string.
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        budget_omitted:
          type: integer
          description: |
            Count of this query's otherwise-returnable hits that were not
            included because the budget did not accommodate them.

    EventInput:
      type: object
      required: [type, priority, data]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          description: Workload-chosen event type. Not validated against a fixed set.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: 1=critical (always retained), 2=high, 3=normal, 4=noise. Workload-assigned.
        data:
          type: object
          additionalProperties: true
          description: Workload-structured JSON payload. CALM does not interpret content.

    WriteEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/EventInput' }

    WriteEventsResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }
        rejected:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: { type: integer }
              reason: { type: string }

    Event:
      type: object
      required: [id, type, priority, data, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        priority: { type: integer, minimum: 1, maximum: 4 }
        data:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    ReadEventsResult:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }

    FeedbackRequest:
      type: object
      required: [correlation_id, outcome]
      additionalProperties: false
      properties:
        correlation_id:
          type: string
          format: uuid
          description: |
            The X-CALM-Correlation-Id value returned by a prior value-producing
            call (/v1/ingest, /v1/search, /v1/snapshot). Canonical UUIDv7 text
            (36 chars, hyphenated). The embedded timestamp gates the
            feedback-acceptance window.
        outcome:
          type: string
          enum: [success, retry, degraded]
          description: |
            Workload-state declaration of how the call's result fared. Unordered —
            CALM does not interpret which outcome is "better"; the workload owns
            the semantics. Recorded once per correlation; subsequent attempts
            return 409.

    SourceSummary:
      type: object
      required: [label, chunks, indexed_at]
      properties:
        label: { type: string }
        chunks: { type: integer }
        indexed_at: { type: string, format: date-time }

    ListSourcesResult:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceSummary' }

    SnapshotResult:
      description: |
        Generic event list ordered by (priority asc, created_at desc) and
        accumulated until `byte_budget_used` approaches the requested
        `budget_bytes`. CALM does not synthesize state — workloads do.
      type: object
      required: [byte_budget_used, budget_exceeded, events]
      properties:
        byte_budget_used:
          type: integer
          description: |
            Summed JSON size of the returned events (the event-payload budget
            unit). Excludes the response envelope and array separators, so the
            HTTP body is slightly larger. Exceeds `budget_bytes` only when a
            single critical (P1) event that alone overflows the budget is
            returned rather than dropped.
        budget_exceeded:
          type: boolean
          description: |
            True when high-priority events alone exceeded `budget_bytes` and
            lower-priority events had to be dropped — or when even the highest
            priority tier was truncated to fit. Workloads can retry with a
            larger `budget_bytes` if their context allows.
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }

    ListManagedSessionsResult:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ManagedSession' }

    DeleteManagedSessionsResult:
      description: Result of bulk-delete in the manage API. `affected_sessions` is set when `dry_run=true`; `deleted_sessions` + `cascaded` are set otherwise.
      type: object
      properties:
        affected_sessions: { type: integer }
        deleted_sessions: { type: integer }
        cascaded: { $ref: '#/components/schemas/CascadeCounts' }

    ClientSummary:
      type: object
      required: [name, session_count]
      properties:
        name: { type: string }
        session_count: { type: integer }
        last_activity:
          type: string
          format: date-time
          description: Absent if the client has never had an active session.

    ListClientsResult:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: { $ref: '#/components/schemas/ClientSummary' }

    DeleteClientResult:
      description: Result of client delete. `affected_sessions` is set when `dry_run=true`; `deleted_client` + `deleted_sessions` + `cascaded` are set otherwise.
      type: object
      properties:
        affected_sessions: { type: integer }
        deleted_client: { type: string }
        deleted_sessions: { type: integer }
        cascaded: { $ref: '#/components/schemas/CascadeCounts' }

    HealthResult:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall health. `ok` iff every check below passed.
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]
          description: |
            Per-dependency status. Keys are check names (e.g., `postgres`,
            `pg_textsearch`, `pg_trgm`); values are `ok` or `failed`. The
            specific set of checks is implementation-defined and may grow
            over time — workloads should not hard-code the key set.

    VersionResult:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Semantic version of the running binary (e.g., `1.0.0`).
        commit:
          type: string
          description: Git commit SHA of the build. Absent in dev builds.
        build_time:
          type: string
          format: date-time
          description: UTC timestamp when the binary was built. Absent in dev builds.
