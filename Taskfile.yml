version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  CALM_BIN: "{{.BIN_DIR}}/calm"
  ADAPTER_BIN: "{{.BIN_DIR}}/calm-adapter"
  TEST_TAGS: "mocks"
  LDFLAGS: "-s -w"

tasks:
  default:
    desc: Quality gate — fmt, lint, test, build (inner-loop "am I clean?" check)
    summary: |
      Inner-loop quality gate. Runs fmt → lint → test → build in order
      so the source tree is formatted, lint-clean, fully tested, and
      buildable in one shot.

      Differs from `task ci`: `ci` also runs `gen:check` to assert that
      generated files (genapi, mocks) match the spec/interfaces. Use `ci`
      before pushing; use bare `task` while iterating.
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build

  tools:install:
    desc: Install developer tools and refresh goenv shims
    summary: |
      Installs gofumpt, goimports, mockery v2, golangci-lint v2, and
      oapi-codegen v2 into the active Go version's GOPATH/bin, then runs
      `goenv rehash` so the binaries become visible on PATH via shim.

      Without the rehash step, newly-installed tools aren't reachable
      from `task` invocations because the goenv shim only proxies tools
      it knows about at shim-creation time.

      Run once after switching Go versions, or after editing this list.
    cmds:
      - go install mvdan.cc/gofumpt@latest
      - go install golang.org/x/tools/cmd/goimports@latest
      - go install github.com/vektra/mockery/v2@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - go install github.com/google/addlicense@latest
      - goenv rehash

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  fmt:
    desc: Format code (gofumpt + goimports + SPDX headers on Go files)
    cmds:
      - gofumpt -w .
      - goimports -local github.com/one-harsh/calm -w .
      - addlicense -c "The CALM Authors" -s=only -l apache -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.sql' -ignore '**/Dockerfile' -ignore '**/*.gen.go' -ignore '**/mock_*.go' -ignore 'bin/**' -ignore '.task/**' .

  lint:
    desc: Run golangci-lint and verify SPDX headers on Go files
    cmds:
      - golangci-lint run ./...
      - addlicense -check -c "The CALM Authors" -s=only -l apache -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.sql' -ignore '**/Dockerfile' -ignore '**/*.gen.go' -ignore '**/mock_*.go' -ignore 'bin/**' -ignore '.task/**' .

  gen:api:
    desc: Regenerate API types/server/client from docs/api/openapi.yaml
    summary: |
      Runs oapi-codegen against `docs/api/openapi.yaml` (the canonical formal
      contract per CLAUDE.md) and produces `internal/api/genapi/genapi.gen.go`.

      Edit the YAML, run this, commit both. Never hand-edit *.gen.go files —
      `task gen:check` (in `task ci`) will fail on drift.
    cmds:
      - mkdir -p internal/api/genapi
      - oapi-codegen -config oapi-codegen.yaml docs/api/openapi.yaml
    sources:
      - docs/api/openapi.yaml
      - oapi-codegen.yaml
    generates:
      - internal/api/genapi/genapi.gen.go

  gen:mocks:
    desc: Regenerate mockery mocks (in-package, build-tagged "mocks")
    summary: |
      Deletes existing `mock_*.go` files under internal/ first, then runs
      mockery v2 against `.mockery.yaml`. The delete-first step catches
      orphaned mocks if a port interface is removed but its mock survives.

      Mocks are in-package (same Go package as the interface) and carry
      `//go:build mocks` so they don't ship in prod binaries. Tests run
      with `-tags=mocks` (set in this Taskfile).
    cmds:
      - find internal -type f -name 'mock_*.go' -delete
      - mockery

  gen:check:
    desc: Re-run codegen and fail if generated files drift from committed state
    summary: |
      Drift gate for codegen. Re-runs `gen:api` and `gen:mocks`, then asserts
      that the affected generated files match their committed copies.

      Watched pathspecs (only generated files, not whole directories):
        - 'internal/api/genapi/*.gen.go'  (oapi-codegen output)
        - 'internal/**/mock_*.go'         (mockery in-package output)

      Catches the "I edited the spec/interface but forgot to commit the
      regenerated code" class of bug. Wired into `task ci`.
    cmds:
      - task: gen:api
      - task: gen:mocks
      - |
        if ! git diff --quiet -- 'internal/api/genapi/*.gen.go' 'internal/**/mock_*.go'; then
          echo "ERROR: generated files are out of date. Run 'task gen:api' and 'task gen:mocks' and commit." >&2
          git --no-pager diff --stat -- 'internal/api/genapi/*.gen.go' 'internal/**/mock_*.go' >&2
          exit 1
        fi

  build:
    desc: Build both binaries (static, no CGO)
    deps: [build:calm, build:adapter]

  build:calm:
    desc: Build the CALM service binary (CGO_ENABLED=0 — static-binary invariant)
    env:
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.CALM_BIN}} ./cmd/calm
    sources:
      - cmd/calm/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.CALM_BIN}}"

  build:adapter:
    desc: Build the MCP adapter binary (CGO_ENABLED=0 — static-binary invariant)
    env:
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.ADAPTER_BIN}} ./cmd/calm-adapter
    sources:
      - cmd/calm-adapter/**/*.go
      - adapter/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.ADAPTER_BIN}}"

  test:
    desc: Run unit tests then integration tests
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Run unit tests (excludes ./test/integration/...; in-package mocks compile in via -tags={{.TEST_TAGS}})
    cmds:
      - |
        PKGS=$(go list ./... | grep -v 'test/integration')
        go test -tags={{.TEST_TAGS}} -race -count=1 $PKGS

  test:cover:
    desc: |
      Unit-test coverage with by-design-untested code stripped, gated at
      MIN_COVERAGE. Exclusions (see EXCLUDE_RE below) are intentional and
      shrink as the codebase matures — when a handler WI lands and brings
      tests, remove that path from the regex.
    vars:
      MIN_COVERAGE: "90"
      # Each line documents why it's excluded. Keep in sync with CLAUDE.md /
      # AGENTS.md "what's not unit-tested" rules.
      #   /mock_*.go        — mockery-generated stubs
      #   *.gen.go          — oapi-codegen output
      #   cmd/              — process entry points; smoke-tested via build
      #   internal/api/     — handlers are 501 stubs; each handler WI brings tests
      #   internal/db/      — DAL is integration-only by CLAUDE.md policy
      #   internal/obs/     — log-field constructors; trivially correct
      #   internal/server/server.go — HTTP lifecycle; covered by integration
      EXCLUDE_RE: '/mock_[^/]+\.go:|\.gen\.go:|/cmd/|/internal/api/|/internal/db/|/internal/obs/|/internal/server/server\.go:'
    cmds:
      - |
        PKGS=$(go list ./... | grep -v 'test/integration')
        go test -tags={{.TEST_TAGS}} -race -count=1 -coverprofile=coverage.out -covermode=atomic $PKGS
        grep -Ev '{{.EXCLUDE_RE}}' coverage.out > coverage.filtered.out
        echo
        echo "=== Per-function coverage (production code in scope) ==="
        go tool cover -func=coverage.filtered.out | awk '/^total:/ {next} {print}'
        TOTAL=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {gsub("%",""); print $NF}')
        echo
        printf "Total: %s%% (gate: %s%%)\n" "$TOTAL" "{{.MIN_COVERAGE}}"
        awk -v t="$TOTAL" -v m="{{.MIN_COVERAGE}}" 'BEGIN { if (t+0 < m+0) { print "FAIL: coverage below gate"; exit 1 } print "OK"; exit 0 }'

  test:integration:
    desc: Run integration tests against the dev Postgres (requires `task dev:up`)
    summary: |
      Each suite run creates a fresh `calm_test_<rand>` database under the
      long-lived Postgres sidecar, runs migrations into it, runs all tests,
      and drops the database at teardown. Requires `task dev:up` to have
      started the sidecar; tests fail fast with a hint if Postgres is
      unreachable.
    env:
      CALM_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    cmds:
      - go test -tags={{.TEST_TAGS}} -race -count=1 ./test/integration/...

  bench:
    desc: Run Go benchmarks under ./internal/... (not part of `task ci`)
    summary: |
      Runs `-bench=. -benchmem` against all packages. Benchmarks are
      excluded from `task test` / `task ci` because they're slow and
      machine-dependent. Use this when measuring a perf-driven decision.

      Cold-cache numbers require dropping OS page cache between runs:
        macOS:  sudo purge && task bench
        Linux:  echo 3 | sudo tee /proc/sys/vm/drop_caches && task bench
    cmds:
      - go test -tags={{.TEST_TAGS}} -bench=. -benchmem -run=^$ ./internal/...

  dco:check:
    desc: Verify every commit in DCO_BASE..HEAD carries a Signed-off-by trailer
    summary: |
      Fails if any commit in the range $DCO_BASE..HEAD (defaults to HEAD~1,
      i.e., the most recent commit) lacks a Signed-off-by trailer. Reads
      trailers via `git interpret-trailers --parse` to handle wrapped /
      multi-line trailers correctly.

      Local: defaults to checking just HEAD~1..HEAD — the commit a developer
      just made before running `task ci`.

      CI: the GitHub workflow sets DCO_BASE to origin/<base_ref> for
      pull_request events and to github.event.before for push events,
      so every commit being introduced gets verified.
    vars:
      BASE: '{{.DCO_BASE | default "HEAD~1"}}'
    cmds:
      - |
        missing=""
        for sha in $(git rev-list {{.BASE}}..HEAD); do
          if ! git show -s --format=%B "$sha" | git interpret-trailers --parse | grep -qi '^Signed-off-by:'; then
            subj=$(git show -s --format=%s "$sha")
            missing="${missing}  ${sha} ${subj}\n"
          fi
        done
        if [ -n "$missing" ]; then
          printf "ERROR: commits in {{.BASE}}..HEAD missing Signed-off-by trailer:\n%b" "$missing"
          printf "Fix: git commit --amend --signoff  (or use git commit -s on future commits)\n"
          exit 1
        fi

  ci:
    desc: CI gate - DCO sign-off, codegen drift check, lint, test, coverage, build
    summary: |
      Full pre-merge gate: dco:check → gen:check → lint → test → test:cover → build.

      dco:check is the first step (fail-fast on commit hygiene before slow
      work). Locally checks just the most recent commit; in CI checks every
      commit being introduced (PR range or push range).

      test:cover runs the unit suite a second time with a coverage profile,
      strips by-design-untested code, and fails if the in-scope total drops
      below MIN_COVERAGE. The duplicate test run is intentional — keeping
      the race-checked test:unit pass independent of the coverage gate makes
      flake triage clearer.

      Safe to run anywhere with the toolchain installed. CI calls this; humans
      can run it before pushing. For inner-loop "am I clean?" without the
      drift + coverage checks, use bare `task` (the default target).
    cmds:
      - task: dco:check
      - task: gen:check
      - task: lint
      - task: test
      - task: test:cover
      - task: build

  run:local:
    desc: Run the CALM service locally against the dev Postgres
    summary: |
      Builds and runs the CALM binary against the local dev Postgres started
      by `task dev:up`.

      Reads config from cmd/calm/config/dev.yaml. The dev config references
      `[env:CALM_DEFAULT_KEY]` for the default-namespace bearer; export it
      before invoking:
        export CALM_DEFAULT_KEY=$(openssl rand -hex 32)

      Any field in the YAML can be overridden via env: prefix `CALM_`, with
      `.` and `-` replaced by `_`. Examples:
        CALM_SERVER_ADDRESS=":9090"     overrides server.address
        CALM_STORAGE_DSN="postgres://..." overrides storage.dsn
    deps: [build:calm]
    env:
      CALM_CONFIG_FILE: "{{.ROOT_DIR}}/cmd/calm/config/dev.yaml"
    cmds:
      - "{{.CALM_BIN}}"

  dev:up:
    desc: Start local Postgres (with pg_textsearch + pg_trgm) for development
    summary: |
      Builds (first time) and starts the local-dev Postgres service defined in
      docker-compose.yml. The image bundles pg_textsearch (compiled from source
      against postgres:17) and runs Postgres with `-c shared_preload_libraries=pg_textsearch`
      so the BM25 access method is available without further config.

      Connection string for `task run:local CALM_STORAGE=postgres`:
        postgres://postgres:postgres@localhost:5432/calm?sslmode=disable

      Data persists across runs in the named docker volume `calm-pg-data`.
      Use `task dev:down` to stop; data survives. Wipe with `docker volume rm calm-pg-data`.
    cmds:
      - docker compose up -d --wait

  dev:down:
    desc: Stop local-dev Postgres (data volume preserved)
    cmds:
      - docker compose down

  docker:build:
    desc: Build the CALM Docker image
    cmds:
      - docker build -t calm:dev .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
