# Annotated example config for operators. Copy, edit, mount at the path you
# point CALM_CONFIG_FILE at. All `service`, `server`, `sessions`, and
# `storage` fields shown below are also their defaults — omit any you don't
# need to change. `namespaces` is required; the service refuses to start
# with an empty list.
#
# Env-var override: any scalar field can be overridden by CALM_<PATH_IN_UPPERCASE>,
# with `.` and `-` replaced by `_`. Examples:
#   CALM_SERVER_ADDRESS=":9090"       overrides server.address
#   CALM_STORAGE_DSN="postgres://..." overrides storage.dsn
# Slice fields (the `namespaces` list) are not env-overridable — changing a
# namespace entry requires editing this file.

service:
  service_name: calm
  version: dev
  environment: production           # local / staging / production
  region: us-east-1

observability:
  logging:
    level: info                     # debug / info / warn / error
    format: json                    # json / console
  otel:
    enabled: false                  # set true to install the W3C TraceContext propagator (extracts inbound `traceparent`, emits outbound `traceresponse`)

server:
  address: ":8080"
  request_timeout: 2s
  graceful_shutdown_wait: 10s
  max_ingest_payload_kb: 1024       # body-size cap on /v1/ingest (>1MB -> 413)
  rate_limit_per_second: 100        # global default; per-namespace overrides below win
  # tls:                            # opt-in: CALM terminates TLS itself (server-auth). Default off — transport security is edge-terminated (mesh/ingress).
  #   enabled: true                 # when true, cert_file + key_file are required
  #   cert_file: "[file:/etc/calm/tls/tls.crt]"   # secret-dialect ([file:]/[env:]/[text:]) -> PEM contents
  #   key_file:  "[file:/etc/calm/tls/tls.key]"

sessions:
  default_ttl_minutes: 120       # absent-TTL fallback for CreateSession. Active sessions never expire (Touch refreshes); only abandoned ones reach this.
  max_ttl_minutes: 10080            # operator ceiling for workload-supplied ttl_minutes (also the OpenAPI hard cap). Lower for tighter compliance/cost limits.
  snapshot_max_budget_kb: 8         # max bytes returned by GET /v1/sessions/{id}/snapshot
  ttl_scanner_interval_ms: 60000    # background scanner cadence; 0 disables the scanner entirely
  ttl_scanner_jitter_ms: 10000      # ± window applied per tick to avoid cross-replica thundering herd; must be < interval

storage:
  dsn: postgres://calm:CHANGE_ME@postgres:5432/calm?sslmode=require
  migrate_on_startup: true          # set false for multi-replica deploys; run migrations as a job
  max_open_conns: 25                # 0 = driver default (unlimited)
  max_idle_conns: 25                # keep equal to max_open_conns so bursts reuse warm connections; must be <= max_open_conns
  conn_max_lifetime: 30m            # 0 = connections never recycled
  trigram_similarity_threshold: 0.5 # pg_trgm.strict_word_similarity_threshold for layer-2 search; raise to tighten recall, lower to loosen

# Identity. Each namespace owns its own sessions, clients, and rate budget.
# api_key is a bracketed secret reference resolved at startup:
#   [text:<literal>]   — inline (avoid in committed config)
#   [env:<VAR>]        — value comes from the named env var
#   [file:<path>]      — value is the file's trimmed contents (e.g., a mounted Secret)
#
# rate_per_second is optional; omitted means "use server.rate_limit_per_second".
namespaces:
  - name: default
    api_key: "[file:/run/secrets/calm-default-key]"
    rate_per_second: 100

  - name: tenant-a
    api_key: "[file:/run/secrets/tenant-a]"
    rate_per_second: 500
