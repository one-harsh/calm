version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - mocks

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - forbidigo
  settings:
    forbidigo:
      forbid:
        # "Transactions live in services, not the DAL": inTx is the private engine
        # of store.WithTx and lives only in internal/db/tx.go (excluded below).
        # Any reappearance elsewhere is a DAL-owned transaction — a design fork.
        - pattern: '\binTx\b'
          msg: "transactions belong in services via store.WithTx, not the DAL (CLAUDE.md: 'Transactions live in services'); inTx is confined to internal/db/tx.go"
        - pattern: '\bBeginTx\b'
          msg: "open transactions only through store.WithTx; BeginTx is confined to internal/db/tx.go"
    revive:
      # Aligned with CLAUDE.md: comments only when they describe a non-obvious
      # constraint. Don't force generic doc comments on every exported symbol.
      # unused-parameter/-receiver are off: interface-matching stubs legitimately
      # ignore arguments.
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    paths:
      - ".*\\.gen\\.go$"
      - "internal/api/genapi/.*"
    rules:
      # tx.go is the sanctioned home of inTx/BeginTx — the engine behind store.WithTx.
      - path: "internal/db/tx\\.go$"
        linters:
          - forbidigo
      - path: "mock_.*\\.go$"
        linters:
          - errcheck
          - gocritic
          - gosec
          - revive
          - staticcheck
          - unused
      - path: "_test\\.go$"
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/one-harsh/calm
