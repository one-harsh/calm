#
# Paired-run benchmark task suite. Seven realistic multi-hour coding tasks stratified by
# quadrant. Prompts are IDENTICAL for every arm and never mention CALM or steer
# tool choice.
#
# clone_setup.fixture:
#   PENDING      — the substrate tip sha has not been wired yet. The runner
#                  REFUSES to run any task whose fixture is PENDING.
#   <40-hex sha> — the substrate tip to CHECK OUT: an orphan whole-tree import
#                  (base + CLAUDE.md strip, plus the task's fixture where it has
#                  one) with neutral cover commits on top. t1/t2/t5 point at
#                  their own substrate; t3/t4/t7/t8/t-smoke share bench/base's tip.
#                  Filled in from create-benchmark-branch.sh before the dry-run gate.
#
# acceptance is a checker path under checks/ (authored during fixture work).
# The runner also refuses to run a task whose checker file is absent, so the
# whole suite stays blocked until fixtures + checkers land.

tasks:
  - id: t1
    quadrant: Q1
    clone_setup:
      fixture: PENDING
    acceptance: checks/t1.sh
    timeout_minutes: 60
    expected_cost_note: "150-400k output tokens"
    prompt: |
      The integration suite is failing (`task test:integration`; Postgres is already up). Root-cause the failures and fix with the minimal change. Do not modify any test file. Explain the defect and its blast radius in `DIAGNOSIS.md` (what broke, which promises it violated, why unit tests missed it).

  - id: t2
    quadrant: Q1
    clone_setup:
      fixture: PENDING
    acceptance: checks/t2.sh
    timeout_minutes: 60
    expected_cost_note: "150-350k output tokens"
    prompt: |
      `task ci` fails its coverage gate. Restore it by writing meaningful tests for the uncovered branches of the affected package — error paths and boundary conditions included, following the repo's testing conventions (sentinel checks, table-driven style). No coverage-gaming: every test must assert behavior, not merely execute lines. `task ci` must pass.

  - id: t3
    quadrant: Q2
    clone_setup:
      fixture: PENDING
    acceptance: checks/t3.sh
    timeout_minutes: 90
    expected_cost_note: "200-400k output tokens"
    prompt: |
      Add a `replace_all` option to the adapter's structured file-edit tool (`internal/adapter/mcp`, `calm_edit_file`): optional boolean, default false; when true, every occurrence of the exact `old_string` is replaced and the response reports the count; when false, current exact-once semantics are unchanged (multi-match stays an error naming the count). Update the tool's input schema and description (they are the LLM-facing contract), keep the presentation/capture contract intact, and cover: single match with flag on and off, multi-match replace with count, multi-match error without flag, zero-match error, and capture/label behavior on multi-edit. `task ci` must pass.

  - id: t4
    quadrant: Q2
    clone_setup:
      fixture: PENDING
    acceptance: checks/t4.sh
    timeout_minutes: 60
    expected_cost_note: "150-350k output tokens"
    prompt: |
      Add a `--json` flag to `calm-capture search` (`internal/adapter/capturecli`): machine-readable results to stdout. The output must be exactly one JSON object with exactly this shape and these field names:

        {
          "query": "<the query string as given>",
          "hits": [
            {
              "source": "<source label>",
              "snippet": "<exact snippet text>",
              "offset": <integer offset hint, or null when absent>,
              "match_layer": "<match layer string, or null when absent>"
            }
          ],
          "degraded": "<reason string, or null when the call succeeded>"
        }

      Hits appear in result order; absent values are null, never omitted keys; no extra top-level keys. Human-readable output remains the default and byte-identical to today. Degraded calls must still exit nonzero with the JSON carrying the reason (the CLI's never-worse contract). Follow the CLI's existing flag/config patterns; unit tests for both modes including a degraded case. `task ci` must pass.

  - id: t5
    quadrant: Q3
    clone_setup:
      fixture: PENDING
    acceptance: checks/t5.sh
    timeout_minutes: 60
    expected_cost_note: "150-400k output tokens"
    prompt: |
      Operator bug report: a search in one session is returning snippets from content ingested by a different session in the same namespace. This violates the project's session-isolation contract. Find the leak, fix it following the codebase's canonical guard pattern, add a regression integration test proving two sessions in one namespace cannot see each other's content through this path, and note in `DIAGNOSIS.md` which existing test SHOULD have caught it and why it didn't. `task test:integration` must pass.

  - id: t7
    quadrant: Q2
    clone_setup:
      fixture: PENDING
    acceptance: checks/t7.sh
    timeout_minutes: 90
    expected_cost_note: "150-400k output tokens"
    prompt: |
      The management API endpoints under `/v1/manage/*` are fully specified in `docs/api/openapi.yaml` but currently return 501. Implement all four operations (list sessions, delete sessions, list clients, delete client) against the committed spec — the spec is the contract; do not change it. Management is namespace-scoped: follow the repository's isolation discipline (cross-namespace requests see nothing; deletes cascade through the established teardown path), its DAL and transaction patterns, and its logging taxonomy. Add integration scenarios named after the promises they verify, covering at minimum: listing reflects created sessions, the client filter, cross-namespace invisibility, and post-delete content invisibility. `task test:integration` and `task ci` must pass.

  - id: t8
    quadrant: Q3
    clone_setup:
      fixture: PENDING
    acceptance: checks/t8.sh
    timeout_minutes: 90
    expected_cost_note: "150-400k output tokens"
    prompt: |
      Captured tool output is sectioned for retrieval, and the section header is the attribution surface a later search hit reports. Two capture families section poorly today: (1) a git diff captures as one section regardless of how many files and hunks it spans, so a hit deep in the diff is attributed to the whole capture and large diffs cannot be paged by file; (2) source-code captures section on boundaries unrelated to the code's structure, so hits get attributed to headers that do not name the code they show. Improve how these captures are sectioned: git-diff content sections per file per hunk with the hunk header naming the section; code content sections on declaration/paragraph boundaries where the format makes them visible, with the section header naming what the section actually contains. Finding the right seam for the change is part of the task. The labeling contract in `internal/adapter/docs/LABELING.md` governs identities — sectioning must not change capture identities, only section boundaries and titles within a capture. Unit tests over representative fixtures (multi-file multi-hunk diff; a Go source file) proving boundaries and titles. `task ci` must pass.

  - id: t-smoke
    quadrant: Q4
    clone_setup:
      fixture: PENDING
    acceptance: checks/t-smoke.sh
    timeout_minutes: 10
    expected_cost_note: "trivial — pipe liveness check, not a measured cell"
    prompt: |
      Create a file named SMOKE.md at the repository root containing exactly this sentence: CALM keeps tool output out of the context window. Then run `task build:capture` and confirm it succeeds.
